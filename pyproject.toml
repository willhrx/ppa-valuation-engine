[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa-valuation-engine"
version = "0.1.0"
description = "Scenario-conditional PPA valuation engine for utility-scale solar"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pvlib>=0.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    "kaleido>=0.2.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ipykernel",
]
calibration = [
    "scikit-learn>=1.3",
]

[project.scripts]
ppa-app = "app.main:run"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ppa_engine*", "app*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
